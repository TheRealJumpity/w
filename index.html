<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title></title>
  <style>
    * {
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: #000000;
      color: #ffffff;
      overflow: hidden;
    }

    /* Subtle animated radial background glow */
    body::before {
      content: "";
      position: absolute;
      width: 500px;
      height: 500px;
      background: radial-gradient(circle, rgba(255,255,255,0.06) 0%, rgba(0,0,0,0) 70%);
      border-radius: 50%;
      pointer-events: none;
      animation: pulseBg 6s ease-in-out infinite alternate;
    }

    @keyframes pulseBg {
      0% { transform: scale(0.85); opacity: 0.5; }
      100% { transform: scale(1.25); opacity: 1; }
    }

    .container {
      position: relative;
      width: 100%;
      max-width: 520px;
      padding: 2rem;
      z-index: 1;
      animation: fadeSlideUp 0.7s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes fadeSlideUp {
      0% {
        opacity: 0;
        transform: translateY(24px) scale(0.97);
      }
      100% {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    .search-box {
      display: flex;
      gap: 0.65rem;
      padding: 0.45rem;
      border-radius: 14px;
      background-color: #0a0a0a;
      border: 1.5px solid #262626;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.9);
      transition: border-color 0.3s ease, box-shadow 0.3s ease, transform 0.25s ease;
    }

    .search-box:focus-within {
      border-color: #ffffff;
      box-shadow: 0 0 25px rgba(255, 255, 255, 0.14);
      transform: translateY(-2px);
    }

    .search-box.invalid {
      border-color: #404040;
      animation: shake 0.35s cubic-bezier(.36,.07,.19,.97) both;
    }

    @keyframes shake {
      10%, 90% { transform: translateX(-2px); }
      20%, 80% { transform: translateX(3px); }
      30%, 50%, 70% { transform: translateX(-4px); }
      40%, 60% { transform: translateX(4px); }
    }

    input[type="text"] {
      flex: 1;
      padding: 0.85rem 1rem;
      font-size: 1.05rem;
      border: none;
      border-radius: 10px;
      background-color: transparent;
      color: #ffffff;
      outline: none;
      letter-spacing: 0.01em;
    }

    input[type="text"]::placeholder {
      color: #525252;
      transition: color 0.25s ease;
    }

    input[type="text"]:focus::placeholder {
      color: #737373;
    }

    button {
      position: relative;
      overflow: hidden;
      padding: 0.85rem 1.75rem;
      font-size: 0.95rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      border: 1.5px solid #ffffff;
      border-radius: 10px;
      background-color: #ffffff;
      color: #000000;
      cursor: pointer;
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }

    button:hover:not(:disabled) {
      background-color: #e5e5e5;
      transform: scale(1.03);
      box-shadow: 0 0 18px rgba(255, 255, 255, 0.35);
    }

    button:active:not(:disabled) {
      transform: scale(0.96);
    }

    button:disabled {
      background-color: #111111;
      border-color: #262626;
      color: #404040;
      cursor: not-allowed;
      transform: scale(1);
      box-shadow: none;
    }

    /* Launch flash animation */
    .launching {
      animation: launchPulse 0.45s ease forwards;
    }

    @keyframes launchPulse {
      0% { transform: scale(1); box-shadow: 0 0 0 rgba(255,255,255,0); }
      50% { transform: scale(1.03); box-shadow: 0 0 35px rgba(255,255,255,0.45); }
      100% { transform: scale(1); box-shadow: 0 0 0 rgba(255,255,255,0); }
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="search-box" id="searchBox">
      <input 
        type="text" 
        id="urlInput" 
        placeholder="example.com" 
        autocomplete="off"
        spellcheck="false"
        autofocus
      />
      <button id="goBtn" disabled>GO</button>
    </div>
  </div>

  <script>
    const urlInput = document.getElementById('urlInput');
    const goBtn = document.getElementById('goBtn');
    const searchBox = document.getElementById('searchBox');

    function formatAndValidate(raw) {
      const trimmed = raw.trim();
      if (!trimmed || /\s/.test(trimmed)) return null;

      // Prepend https:// if no protocol is present
      const normalized = /^https?:\/\//i.test(trimmed) ? trimmed : `https://${trimmed}`;

      try {
        const parsed = new URL(normalized);
        // Require a valid domain structure (e.g., domain.tld) or localhost
        const host = parsed.hostname;
        const isValidHost = host === 'localhost' || (/^[a-zA-Z0-9.-]+\.[a-zA-Z]{2,}$/.test(host) && !host.startsWith('.') && !host.endsWith('.'));
        
        if ((parsed.protocol === 'http:' || parsed.protocol === 'https:') && isValidHost) {
          return parsed.href;
        }
        return null;
      } catch (_) {
        return null;
      }
    }

    urlInput.addEventListener('input', () => {
      const validUrl = formatAndValidate(urlInput.value);

      if (validUrl) {
        goBtn.disabled = false;
        searchBox.classList.remove('invalid');
      } else {
        goBtn.disabled = true;
      }
    });

    function launchUrl() {
      const targetUrl = formatAndValidate(urlInput.value);
      
      if (!targetUrl) {
        searchBox.classList.remove('invalid');
        void searchBox.offsetWidth; // trigger reflow to restart shake animation
        searchBox.classList.add('invalid');
        return;
      }

      // Trigger launch glow animation
      searchBox.classList.remove('launching');
      void searchBox.offsetWidth;
      searchBox.classList.add('launching');

      // 1. If hosted inside an existing WebView2 app
      if (window.chrome && window.chrome.webview) {
        window.chrome.webview.postMessage({ action: "open_webview2", url: targetUrl });
        return;
      }

      // 2. Fallback standalone window
      window.open(targetUrl, '_blank', 'width=1024,height=768,menubar=no,toolbar=no,location=yes,status=no');
    }

    goBtn.addEventListener('click', launchUrl);

    urlInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        launchUrl();
      }
    });
  </script>

</body>
</html>
