<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Startpage</title>
    <style>
        /* Reset and Core Styles */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: '-apple-system', BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #0b0c10;
            color: #c5c6c7;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        /* Subtle Background Glow Animation */
        body::before {
            content: '';
            position: absolute;
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, rgba(102, 252, 241, 0.05) 0%, rgba(0,0,0,0) 70%);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 0;
            pointer-events: none;
        }

        /* Main Container Entrance Animation */
        .search-container {
            text-align: center;
            z-index: 1;
            width: 100%;
            max-width: 580px;
            padding: 20px;
            animation: fadeIn 0.8s cubic-bezier(0.16, 1, 0.3, 1);
        }

        /* Search Form & Input */
        .search-form {
            position: relative;
            width: 100%;
        }

        .search-input {
            width: 100%;
            padding: 16px 24px;
            font-size: 16px;
            background-color: #1f2833;
            border: 1px solid #45a29e;
            border-radius: 30px;
            color: #ffffff;
            outline: none;
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
        }

        .search-input:focus {
            background-color: #151a21;
            border-color: #66fcf1;
            box-shadow: 0 0 15px rgba(102, 252, 241, 0.3), 0 4px 20px rgba(0, 0, 0, 0.5);
            transform: translateY(-2px);
        }

        /* Bookmark Drawer Toggle Button */
        .drawer-toggle {
            position: fixed;
            top: 30px;
            right: 30px;
            background: #1f2833;
            border: 1px solid #45a29e;
            color: #66fcf1;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 20px;
            z-index: 10;
            transition: all 0.3s ease;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.2);
        }

        .drawer-toggle:hover {
            background: #66fcf1;
            color: #0b0c10;
            transform: scale(1.05) rotate(90deg);
            box-shadow: 0 0 12px rgba(102, 252, 241, 0.5);
        }

        /* Sidebar Slide-out Panel */
        .bookmark-drawer {
            position: fixed;
            top: 0;
            right: -320px;
            width: 320px;
            height: 100%;
            background-color: #151a21;
            border-left: 1px solid #1f2833;
            box-shadow: -5px 0 25px rgba(0, 0, 0, 0.5);
            transition: right 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            padding: 100px 30px 30px 30px;
            z-index: 5;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .bookmark-drawer.open {
            right: 0;
        }

        .drawer-title {
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #45a29e;
            margin-bottom: 10px;
        }

        /* Bookmark Links */
        .bookmark-link {
            display: flex;
            align-items: center;
            padding: 12px 16px;
            background: #1f2833;
            border-radius: 8px;
            color: #c5c6c7;
            text-decoration: none;
            font-size: 15px;
            border: 1px solid transparent;
            transition: all 0.2s ease;
        }

        .bookmark-link:hover {
            background: #233142;
            color: #66fcf1;
            border-color: rgba(102, 252, 241, 0.2);
            transform: translateX(-5px);
        }

        /* Animations */
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>
<body>

    <!-- Toggle Button for Bookmarks -->
    <button class="drawer-toggle" id="menuBtn" aria-label="Open Bookmarks">☰</button>

    <!-- Central Search Bar -->
    <div class="search-container">
        <form class="search-form" action="https://google.com" method="GET">
            <input 
                type="text" 
                name="q" 
                class="search-input" 
                placeholder="Search the web..." 
                autocomplete="off" 
                autofocus
            >
        </form>
    </div>

    <!-- Right Slide-out Bookmarks Drawer -->
    <div class="bookmark-drawer" id="drawer">
        <div class="drawer-title">Quick Links</div>
        
        <!-- Customize your links here -->
        <a href="https://github.com" target="_blank" class="bookmark-link">GitHub</a>
        <a href="https://youtube.com" target="_blank" class="bookmark-link">YouTube</a>
        <a href="https://reddit.com" target="_blank" class="bookmark-link">Reddit</a>
        <a href="https://ycombinator.com" target="_blank" class="bookmark-link">Hacker News</a>
    </div>

    <script>
        const menuBtn = document.getElementById('menuBtn');
        const drawer = document.getElementById('drawer');

        // Toggle drawer open/close
        menuBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            drawer.classList.toggle('open');
            menuBtn.innerHTML = drawer.classList.contains('open') ? '✕' : '☰';
        });

        // Close drawer when clicking anywhere outside of it
        document.addEventListener('click', (e) => {
            if (!drawer.contains(e.target) && !menuBtn.contains(e.target)) {
                drawer.classList.remove('open');
                menuBtn.innerHTML = '☰';
            }
        });
    </script>
</body>
</html>
