<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WebView2 Opener</title>
  <style>
    * {
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: #0f172a;
      color: #f8fafc;
    }
    .container {
      width: 100%;
      max-width: 500px;
      padding: 2rem;
      text-align: center;
    }
    h1 {
      font-size: 1.5rem;
      margin-bottom: 1.5rem;
      font-weight: 600;
      color: #e2e8f0;
    }
    .search-box {
      display: flex;
      gap: 0.5rem;
    }
    input[type="text"] {
      flex: 1;
      padding: 0.75rem 1rem;
      font-size: 1rem;
      border: 2px solid #334155;
      border-radius: 8px;
      background-color: #1e293b;
      color: #ffffff;
      outline: none;
      transition: border-color 0.2s;
    }
    input[type="text"]:focus {
      border-color: #3b82f6;
    }
    input[type="text"].invalid {
      border-color: #ef4444;
    }
    button {
      padding: 0.75rem 1.5rem;
      font-size: 1rem;
      font-weight: 600;
      border: none;
      border-radius: 8px;
      background-color: #3b82f6;
      color: white;
      cursor: pointer;
      transition: background-color 0.2s, opacity 0.2s;
    }
    button:hover:not(:disabled) {
      background-color: #2563eb;
    }
    button:disabled {
      background-color: #475569;
      color: #94a3b8;
      cursor: not-allowed;
      opacity: 0.6;
    }
    .status {
      margin-top: 0.75rem;
      font-size: 0.875rem;
      min-height: 1.25rem;
      color: #94a3b8;
    }
    .status.error {
      color: #f87171;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>WebView2 Launcher</h1>
    <div class="search-box">
      <input 
        type="text" 
        id="urlInput" 
        placeholder="https://example.com" 
        autocomplete="off"
        spellcheck="false"
      />
      <button id="goBtn" disabled>GO</button>
    </div>
    <div id="statusText" class="status">Enter a valid http:// or https:// URL</div>
  </div>

  <script>
    const urlInput = document.getElementById('urlInput');
    const goBtn = document.getElementById('goBtn');
    const statusText = document.getElementById('statusText');

    function isValidUrl(string) {
      try {
        const url = new URL(string);
        return (url.protocol === "http:" || url.protocol === "https:") && url.hostname.includes(".");
      } catch (_) {
        return false;
      }
    }

    urlInput.addEventListener('input', () => {
      const value = urlInput.value.trim();

      if (value === "") {
        goBtn.disabled = true;
        urlInput.classList.remove('invalid');
        statusText.textContent = "Enter a valid http:// or https:// URL";
        statusText.classList.remove('error');
        return;
      }

      if (isValidUrl(value)) {
        goBtn.disabled = false;
        urlInput.classList.remove('invalid');
        statusText.textContent = "Ready to launch";
        statusText.classList.remove('error');
      } else {
        goBtn.disabled = true;
        urlInput.classList.add('invalid');
        statusText.textContent = "Invalid URL (must include http:// or https:// and a valid domain)";
        statusText.classList.add('error');
      }
    });

    function launchUrl() {
      const targetUrl = urlInput.value.trim();
      if (!isValidUrl(targetUrl)) return;

      // 1. If running inside an existing WebView2 host, post a message to C#/C++
      if (window.chrome && window.chrome.webview) {
        window.chrome.webview.postMessage({ action: "open_webview2", url: targetUrl });
        return;
      }

      // 2. Otherwise, attempt custom protocol handler OR open a clean popup window
      // Replace 'webview2://' with your registered Windows custom URI scheme if you have one
      // window.location.href = `webview2://open?url=${encodeURIComponent(targetUrl)}`;

      // Fallback: Open a standalone browser popup window
      window.open(targetUrl, '_blank', 'width=1024,height=768,menubar=no,toolbar=no,location=yes,status=no');
    }

    goBtn.addEventListener('click', launchUrl);

    urlInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !goBtn.disabled) {
        launchUrl();
      }
    });
  </script>

</body>
</html>
